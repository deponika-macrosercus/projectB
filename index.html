<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>체스 이기기 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>체스 이기기 연습</h1>
    <p class="sub">기보를 입력하고 이겨야 하는 색을 고르세요. 그 색은 엔진이, 반대 색은 내가 둡니다.</p>
  </header>

  <main>
    <section class="board-wrap">
      <div id="status" class="status">기보를 불러오세요.</div>
      <div id="board" class="board"></div>
      <div class="eval">
        <span>평가치 (이겨야 하는 색 기준):</span>
        <strong id="eval">-</strong>
      </div>
    </section>

    <section class="panel">
      <!-- 1단계: 기보 입력 -->
      <div id="setup">
        <h2>1. 기보 입력</h2>
        <textarea id="pgn" rows="7" placeholder="예) 1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4&#10;PGN 전체를 붙여넣어도 됩니다. 비워두면 초기 배치에서 시작합니다."></textarea>
        <div class="row">
          <button id="loadBtn">기보 불러오기</button>
          <input id="fen" type="text" placeholder="(선택) FEN으로 시작 국면 지정">
        </div>
        <div id="loadError" class="error"></div>

        <h2>2. 시작 지점 선택</h2>
        <p class="hint">수를 클릭하면 그 수 직후 국면에서 시작합니다. 기본값은 기보의 마지막 수입니다.</p>
        <div class="row nav">
          <button data-nav="first">⏮</button>
          <button data-nav="prev">◀</button>
          <button data-nav="next">▶</button>
          <button data-nav="last">⏭</button>
        </div>
        <ol id="moveList" class="move-list"></ol>

        <h2>3. 이겨야 하는 색</h2>
        <div class="row">
          <label><input type="radio" name="winner" value="w" checked> 백 (엔진이 백)</label>
          <label><input type="radio" name="winner" value="b"> 흑 (엔진이 흑)</label>
        </div>

        <h2>4. 엔진 설정</h2>
        <div class="row">
          <label>생각 시간
            <select id="movetime">
              <option value="300">0.3초</option>
              <option value="1000" selected>1초</option>
              <option value="2000">2초</option>
              <option value="5000">5초</option>
            </select>
          </label>
          <label>실력(0~20)
            <input id="skill" type="number" min="0" max="20" value="20">
          </label>
        </div>

        <button id="startBtn" class="primary">시작</button>
      </div>

      <!-- 플레이 단계 -->
      <div id="play" hidden>
        <h2>대국 중</h2>
        <p id="roles" class="hint"></p>
        <div class="row">
          <label>승급 기물
            <select id="promo">
              <option value="q">퀸</option>
              <option value="r">룩</option>
              <option value="b">비숍</option>
              <option value="n">나이트</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="undoBtn">한 수 무르기</button>
          <button id="restartBtn">시작 국면부터 다시</button>
          <button id="flipBtn">보드 뒤집기</button>
        </div>
        <div class="row">
          <button id="backBtn">기보 입력으로 돌아가기</button>
          <button id="copyBtn">PGN 복사</button>
        </div>
        <h3>진행된 수</h3>
        <ol id="playList" class="move-list"></ol>
      </div>
    </section>
  </main>

  <script src="vendor/chess.js"></script>
  <script src="pieces.js"></script>
  <script src="app.js"></script>
</body>
</html>
